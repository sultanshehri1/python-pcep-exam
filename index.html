<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>نموذج اختبارات بايثون - معهد بايثون</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="app">
    <header>
      <h1>نموذج اختبارات بايثون</h1>
      <p id="subtitle">اختر مستوى الشهادة وابدأ الاختبار التفاعلي</p>
    </header>

    <section id="start-screen" class="card">
      <label for="level">المستوى</label>
      <select id="level">
        <option value="PCEP">PCEP (مبتدئ)</option>
        <option value="PCAP">PCAP (مساعد)</option>
        <option value="PCPP-1">PCPP-1 (متقدم)</option>
        <option value="PCPP-2">PCPP-2 (متقدم جداً)</option>
      </select>

      <label for="count">عدد الأسئلة</label>
      <input id="count" type="number" min="1" max="100" value="10"/>

      <p id="available-info" class="small">متوفر في هذا المستوى: ...</p>

      <label class="checkbox-inline">
        <input type="checkbox" id="timed" /> اختبار بزمن محدود
      </label>

      <button id="start-btn" class="btn primary">ابدأ الاختبار</button>
    </section>

    <section id="exam-screen" class="hidden card">
      <div class="top-row">
        <div id="progress">السؤال <span id="q-index">1</span> / <span id="q-total">10</span></div>
        <div id="timer" class="timer">00:00</div>
      </div>
      <article id="question-area"></article>
      <div id="controls" class="controls">
        <button id="prev-btn" class="btn">السابق</button>
        <button id="next-btn" class="btn">التالي</button>
        <button id="finish-btn" class="btn primary">إنهاء</button>
      </div>
    </section>

    <section id="result-screen" class="hidden card">
      <h2>النتيجة</h2>
      <div id="score"></div>
      <div id="review"></div>
      <button id="home-btn" class="btn">العودة للصفحة الرئيسية</button>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
